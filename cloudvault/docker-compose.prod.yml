name: cloudvault

networks:
  cloudvault-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:

  # ---------------------------------------------------------------
  # PostgreSQL — one instance, separate logical DBs per service
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cloudvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth_db}
      METADATA_DB_NAME: ${METADATA_DB_NAME:-metadata_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudvault}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # Redis — session/upload-state cache and metadata cache
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cloudvault-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: cloudvault-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # MinIO Init — auto-creates bucket
  # ---------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: cloudvault-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      (mc mb local/${MINIO_BUCKET_NAME:-cloudvault-files} || true) &&
      mc anonymous set download local/${MINIO_BUCKET_NAME:-cloudvault-files} &&
      echo 'Bucket ready.'
      "
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # 1. Auth Service
  # ---------------------------------------------------------------
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: cloudvault-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      DB_USER: ${POSTGRES_USER:-cloudvault}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      JWT_SECRET: ${JWT_SECRET:-Agezt1A2k3bvuJz3ZX+nv5OFJM+ZIli5OAp2iX1bhUJQShgUjwjXSQeNfBF/rx8D+EcJFhBlxKDo7FSyiWZ3Bw==}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-15}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS:-7}
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # 2. Metadata Service
  # ---------------------------------------------------------------
  metadata-service:
    build:
      context: ./metadata-service
      dockerfile: Dockerfile
    container_name: cloudvault-metadata-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${METADATA_DB_NAME:-metadata_db}
      DB_USER: ${POSTGRES_USER:-cloudvault}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-Agezt1A2k3bvuJz3ZX+nv5OFJM+ZIli5OAp2iX1bhUJQShgUjwjXSQeNfBF/rx8D+EcJFhBlxKDo7FSyiWZ3Bw==}
    ports:
      - "${METADATA_SERVICE_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # 3. File Service
  # ---------------------------------------------------------------
  file-service:
    build:
      context: ./file-service
      dockerfile: Dockerfile
    container_name: cloudvault-file-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_BUCKET: ${MINIO_BUCKET_NAME:-cloudvault-files}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      METADATA_SERVICE_URL: http://metadata-service:8080
      JWT_SECRET: ${JWT_SECRET:-Agezt1A2k3bvuJz3ZX+nv5OFJM+ZIli5OAp2iX1bhUJQShgUjwjXSQeNfBF/rx8D+EcJFhBlxKDo7FSyiWZ3Bw==}
    ports:
      - "${FILE_SERVICE_PORT:-8082}:8080"
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      metadata-service:
        condition: service_started
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # 4. API Gateway
  # ---------------------------------------------------------------
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: cloudvault-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:8080
      FILE_SERVICE_URL: http://file-service:8080
      METADATA_SERVICE_URL: http://metadata-service:8080
      JWT_SECRET: ${JWT_SECRET:-Agezt1A2k3bvuJz3ZX+nv5OFJM+ZIli5OAp2iX1bhUJQShgUjwjXSQeNfBF/rx8D+EcJFhBlxKDo7FSyiWZ3Bw==}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      - auth-service
      - file-service
      - metadata-service
      - redis
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # 5. React Frontend (Nginx)
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: cloudvault-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api-gateway
    networks:
      - cloudvault-net
