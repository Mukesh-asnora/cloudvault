apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cloudvault
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: cloudvault/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "75m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          env:
            - name: REDIS_HOST
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: REDIS_HOST } }
            - name: REDIS_PORT
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: REDIS_PORT } }
            - name: AUTH_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: AUTH_SERVICE_URL } }
            - name: METADATA_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: METADATA_SERVICE_URL } }
            - name: FILE_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: FILE_SERVICE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: cloudvault-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cloudvault
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
