apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cloudvault
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: cloudvault-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: cloudvault-secrets, key: POSTGRES_PASSWORD } }
            - name: AUTH_DB_NAME
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: AUTH_DB_NAME } }
            - name: METADATA_DB_NAME
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: METADATA_DB_NAME } }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "cloudvault"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "cloudvault"] }
            periodSeconds: 10
      volumes:
        - name: init-script
          configMap: { name: db-init-script, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata: { name: postgres-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloudvault
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
  clusterIP: None
