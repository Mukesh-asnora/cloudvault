apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: cloudvault
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: cloudvault/auth-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "50m", memory: "192Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: DB_PORT } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: AUTH_DB_NAME } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: cloudvault-secrets, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: cloudvault-secrets, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: cloudvault-secrets, key: JWT_SECRET } }
            - name: JWT_EXPIRY_MINUTES
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: JWT_EXPIRY_MINUTES } }
            - name: JWT_REFRESH_EXPIRY_DAYS
              valueFrom: { configMapKeyRef: { name: cloudvault-config, key: JWT_REFRESH_EXPIRY_DAYS } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: cloudvault
spec:
  selector: { app: auth-service }
  ports: [{ port: 8080, targetPort: 8080 }]
