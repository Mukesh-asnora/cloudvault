name: cloudvault

networks:
  cloudvault-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:

  # ---------------------------------------------------------------
  # PostgreSQL — one instance, separate logical DBs per service.
  # In production each service would get its own instance; locally
  # this keeps resource usage low without changing the app code.
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cloudvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      METADATA_DB_NAME: ${METADATA_DB_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # Redis — session/upload-state cache and metadata cache.
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cloudvault-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # MinIO — S3-compatible object storage for local dev (zero AWS cost).
  # ---------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: cloudvault-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
  # One-shot job: waits for MinIO, then creates the bucket the file
  # service expects. Runs once and exits — this is what makes
  # `docker-compose up` fully self-provisioning with zero manual
  # console clicking.
  # ---------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: cloudvault-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      (mc mb local/${MINIO_BUCKET_NAME} || true) &&
      mc anonymous set download local/${MINIO_BUCKET_NAME} &&
      echo 'Bucket ${MINIO_BUCKET_NAME} ready.'
      "
    networks:
      - cloudvault-net

  # ---------------------------------------------------------------
